// ⚠⚠ 2026-10-05：预览框 ←→ 预览条 双向通知（用户实测"预览窗口活着、小图标窗口死了"）。
//
//   为什么单独写在这一段而不是塞进主脚本块：
//     主脚本块（上面那个大 <script>）在 tween-preview.js 【之前】执行，
//     那一刻 window.V7Tween 还不存在，注册会静默落空。
//     这个坑本项目栽过 —— "脚本抛错/时机不对，后面绑定全没跑"（铁律 17）。
//
//   为什么要双向：
//     · 预览条收 → 框也要收：在主脚本块里（inConnected 判定那处）
//     · 框收   → 预览条也要收：这里（框自己收到鼠标离开时会 hideBox）
//   两个模块各管一半 DOM，只做单向就必然留下"只死一边"的窗口期。
//
//   ⚠ clearPreview 是主脚本块的顶层函数（那个块没有被 IIFE 包住），
//     这里能直接调到；用 typeof 挡一道，将来结构变了也不会把这段打崩。
// ⭐⭐⭐ 2026-10-08（docs/170 §十四 · 用户拍板）：启动时把插帧遗留文件清掉。
//
//  ⚠ 为什么放在【页面加载完】才跑：清理要搬几个 G 的文件（实测 22.80 GB），
//    在启动路径上 await 它 = 用户要多等十几秒才看到界面。
//    这件事和"界面能不能用"完全无关。
//  ⚠ 为什么只做一次：localStorage 打标记（见函数里的 FLAG）。
//  ⚠ 失败静默：清垃圾清不动，不该弹一个红框吓用户。函数内部自己吞。
(function () {
  if (typeof purgeLegacyTweenFilesOnce !== 'function') return;
  var run = function () {
    try { purgeLegacyTweenFilesOnce(); } catch (_) {}
  };
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(run, 1500);          // 先让界面动起来
  } else {
    window.addEventListener('load', function () { setTimeout(run, 1500); });
  }
})();

(function () {
  'use strict';
  if (!window.V7Tween || typeof window.V7Tween.setBoxClosedHandler !== 'function') {
    console.error('[预览] V7Tween 没加载好，预览框/预览条的联动收不起来');
    return;
  }
  window.V7Tween.setBoxClosedHandler(function (taskId) {
    // ⭐⭐ 2026-10-09（docs/191，用户反馈）：「我其实只希望收起展开的大图就好了」。
    //   ⚠ 用户【自己点一下收掉大图】时，不该把右滑打开的预览条一起带走 ——
    //     那条还要接着用（换图、传回、应用）。所以那种情况下这里直接返回。
    //   ⚠ 只有"鼠标移开 / 切任务"这类自动收起才连条一起收（原来的行为，不动）。
    if (window.boxCloseConsumeImageOnly && window.boxCloseConsumeImageOnly()) return;
    // ⚠ 只收【这张任务】的预览条。用户快速划过两张卡时，
    //   框可能已经指向别的任务了，不判归属就会把别人的条关掉。
    var el = document.querySelector('.task[data-task="' + String(taskId).replace(/"/g, '\\"') + '"]');
    var pv = el ? el.querySelector('.task-preview.show') : null;
    // ⭐⭐ 2026-10-09（用户报「为什么现在还是收缩不进去呢」）——
    //   上面那条路收不到时，做一次【保守兜底】：只收**当前栈顶那张卡**的条。
    //   ⚠⚠ 为什么必须有兜底：这条通知是"收条"唯一的出口。只要有一次
    //     "开条时没认下归属"（归属是上一张卡的 / 归属那张卡已经不在了），
    //     条就永远收不掉 —— 那就是用户说的"有时候收不回去"里那个"有时候"。
    //   ⚠ 为什么兜底只认"栈顶那张卡"而不是"随便哪条开着的"：
    //     随便收会误伤 —— 160ms 宽限期内刚弹出的、属于别的卡的条会被收掉
    //     （2026-10-09 实测：那样改挂了 hover-opens / boxtaskid-string 两个探针）。
    //     而"栈顶那张卡"正是用户此刻在看的、mousemove 一直在处理的那张，
    //     它的条确实该收。
    if (!pv) {
      var topTask = document.querySelector('#tasks .task');
      if (topTask) pv = topTask.querySelector('.task-preview.show');
    }
    if (pv) {
      pv.classList.remove('show');
      if (window.__pv === pv) window.__pv = null;
    }
  });
})();
</script>

<script>
(function(){
  'use strict';
  const nav=document.getElementById('v7PrimaryNav'),back=document.querySelector('[data-v7-nav-back]'),crumb=document.querySelector('[data-v7-nav-crumb]');
  const labels={generation:'生成台',settings:'设置中心',records:'记录与恢复',tools:'工具箱'};
  const targets={generation:['generation',0],settings:['settings',0],records:['history',0],tools:['debug',0]};
  const entries={generation:'generation',settings:'settings',records:'records',tools:'tools'};
  const history=[],positions=new Map();
  let active=null,sequence=0,pending=0,restoring=false,refreshFrame=0,workspaceTitle='',workspaceExpanded=false,swallowClickUntil=0;
  const routeKey=route=>route.card+':'+route.zone+':'+JSON.stringify(route.options||{});
  function category(route){
    if(route.options?.navigationCategory&&labels[route.options.navigationCategory])return route.options.navigationCategory;
    if(route.card==='history')return 'records';
    if(route.card==='settings'||route.card==='engines'||route.card==='assistant'&&[1,2].includes(route.zone))return 'settings';
    return ['generation','presets'].includes(route.card)?'generation':'tools';
  }
  function focusIdentity(element){
    if(!element||!detail.contains(element))return null;
    if(element.id)return '#'+CSS.escape(element.id);
    for(const key of ['data-setting','data-service-tab','data-card-route','data-quick-action','data-action','data-history-action','name']){
      const value=element.getAttribute(key);if(value)return '['+key+'="'+CSS.escape(value)+'"]';
    }
    return null;
  }
  function snapshot(){
    const id=cards[cur]?.dataset.card||'generation',same=active?.card===id&&active?.zone===zoneSel;
    return {card:id,zone:zoneSel,options:same?{...active.options}:{},open:detail.classList.contains('show'),scroll:detail.querySelector('.dc-scroll').scrollTop,focus:document.activeElement,focusSelector:focusIdentity(document.activeElement),presetKind:presetZoneKind};
  }
  function remember(route){
    if(!route)return;positions.set(routeKey(route),{scroll:route.scroll,focusSelector:route.focusSelector});
    if(positions.size>60)positions.delete(positions.keys().next().value);
  }
  function push(route){
    const previous=history[history.length-1];
    if(!previous||routeKey(previous)!==routeKey(route)||previous.open!==route.open)history.push(route);
    if(history.length>40)history.shift();
  }
  function update(){
    refreshFrame=0;
    const current=snapshot();
    if(!pending&&active&&(active.card!==current.card||active.zone!==current.zone)){
      remember(active);push(active);active=current;
    }
    if(!active)active=current;
    const group=category(active),zone=ZONE_SETS[cur]?.[zoneSel]?.[1]||cards[cur]?.dataset.bglabel||'';
    nav.querySelectorAll('button').forEach(button=>{if(button.dataset.v7Primary===group)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
    // ⭐ 2026-10-22（docs/263 三级卡瘦身）：这行只写当前这页的名字（下面那行重复的大标题已藏），完整路径放悬停提示
    const pageName=String(detail.querySelector('.dc-name')?.textContent||'').trim();
    const head=workspaceTitle||pageName||zone||labels[group];
    const text=labels[group]+((workspaceTitle||zone)?' / '+(workspaceTitle||zone):'');crumb.textContent=head;crumb.title=text+(head!==(workspaceTitle||zone)&&head!==labels[group]?' / '+head:'');
    back.disabled=!history.length||!!pending;
    back.title=history.length?'返回 '+labels[category(history[history.length-1]) ]:'返回原入口';

  function begin(id,index,options){
    const before=snapshot(),next={card:id,zone:Number(index)||0,options:{...(options||{})}},token=++sequence;
    if(!cards.some(card=>card.dataset.card===id))return null;
    remember(before);
    if(!restoring&&(routeKey(before)!==routeKey(next)||!before.open))push(before);
    pending=token;active={...next,open:true,scroll:0};schedule();
    return {token,key:routeKey(next),restore:restoring};
  }
  function commit(transaction,cancelled){
    if(!transaction||transaction.token!==pending)return;
    pending=0;
    if(!cancelled){
      const saved=positions.get(transaction.key);
      if(saved)detail.querySelector('.dc-scroll').scrollTop=saved.scroll||0;
    }
    update();
  }
  async function goBack(){
    if(pending||!history.length)return false;
    const target=history[history.length-1],owner=sequence;
    restoring=true;
    try{
      if(target.card==='presets')presetZoneKind=target.presetKind||'list';
      const modules={'network':'V7NetworkDoctor','browser-bookmarks':'V7BrowserBookmarks','scopes':'V7ImageScopes','layout':'V7LayoutManager'};
      const module=target.options?.workspace&&window[modules[target.options.workspace]];
      const result=module?.open?await module.open():await navigateCard(target.card,target.zone,target.options);
      if(!result||result.cancelled||sequence!==owner+1)return false;
      if(history[history.length-1]===target)history.pop();
      if(!target.open)closeAll();
      detail.querySelector('.dc-scroll').scrollTop=target.scroll||0;
      const focus=target.focus?.isConnected?target.focus:target.focusSelector?detail.querySelector(target.focusSelector):null;
      if(focus?.checkVisibility()&&!focus.disabled)focus.focus({preventScroll:true});
      else nav.querySelector('[data-v7-primary="'+category(target)+'"]')?.focus({preventScroll:true});
      return true;
    }catch(error){window.ERR?.report('LAYOUT_FAILED',{message:String(error.message||error)});return false;}
    finally{restoring=false;update();}
  }
  nav.addEventListener('click',async event=>{
    const button=event.target.closest('[data-v7-primary]');if(!button)return;
    event.preventDefault();event.stopPropagation();

    try{
      const registry=window.V7RouteRegistry;
      if(registry?.routes?.[entries[group]])await registry.open(entries[group],{navigationCategory:group});
      else await navigateCard(...targets[group],{navigationCategory:group});
    }catch(error){window.ERR?.report('LAYOUT_FAILED',{message:String(error.message||error)});}
  });
  nav.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const buttons=[...nav.querySelectorAll('[data-v7-primary]')],index=buttons.indexOf(document.activeElement);if(index<0)return;
    event.preventDefault();event.stopPropagation();buttons[event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus();

  document.querySelector('[data-v7-nav-close]').onclick=event=>{event.preventDefault();event.stopPropagation();closeAll();nav.querySelector('[aria-current="page"]')?.focus({preventScroll:true});};

  detail.addEventListener('scroll',()=>{if(!pending&&active){active.scroll=detail.querySelector('.dc-scroll').scrollTop;remember(active);}},{capture:true,passive:true});

  new MutationObserver(schedule).observe(detail,{attributes:true,attributeFilter:['class']});

  function resizeWorkspace(){
    if(!detail.classList.contains('workspace-host'))return;
    // ⚠ 工具工作面自己算几何（横跨三段 880×400 / 自由模式就地展开）。
    //   这里必须让路，否则窗口一缩放/切卡，几何就被下面这套覆盖回默认工作面尺寸。
    // ⚠ 判据用 DOM 上的 v7tw-host，不能只信模块的 active：收起动画一开始模块就把 active 清了，
    //   这一刻被这里接手，大卡就不是缩回当前卡，而是被改成 640 宽贴在右边（2026-09-28 实测抓到）。
    if(detail.classList.contains('v7tw-host')||window.V7ToolWorkbench?.ownsGeometry?.())return;
    const card=cards[cur].getBoundingClientRect(),anchor=anchorEl.getBoundingClientRect(),margin=16;
    let width=workspaceExpanded?innerWidth-margin*2:Math.min(640,innerWidth-margin*2),left=margin;
    const rightSpace=innerWidth-card.right-24-margin,leftSpace=card.left-24-margin;
    if(!workspaceExpanded&&rightSpace>=420){width=Math.min(width,rightSpace);left=card.right+24;}
    else if(!workspaceExpanded&&leftSpace>=420){width=Math.min(width,leftSpace);left=card.left-width-24;}
    const limits=window.V7FloatingBars?.workArea?.()||{top:60,bottom:innerHeight-16};
    const height=Math.max(180,Math.min(workspaceExpanded?innerHeight:640,limits.bottom-limits.top)),top=Math.max(limits.top,Math.min(card.top,limits.bottom-height));
    const expand=document.querySelector('[data-v7-nav-expand]');expand.hidden=false;expand.setAttribute('aria-pressed',String(workspaceExpanded));expand.title=workspaceExpanded?'还原工作区':'扩大工作区';expand.setAttribute('aria-label',expand.title);

    const body=result.body;window.V7CardArchitecture?.reset(body);
    workspaceTitle=spec.title;workspaceExpanded=/(camera|creative|canvas)/.test(spec.id);detail.classList.add('workspace-host');resizeWorkspace();
    const handle=V7Workspaces.mount(body,spec.id,spec.title,spec.description,spec.mount,{onClose:(_handle,meta)=>{
      workspaceTitle='';detail.classList.remove('workspace-host');document.querySelector('[data-v7-nav-expand]').hidden=true;
      for(const key of ['left','top','width','height'])detail.style.removeProperty('--workspace-'+key);
      if(meta?.reason==='close')goBack();else schedule();
    }});
    detailUsed=true;schedule();return handle;
  }});
  window.V7NavigationShell={begin,commit,back:goBack,refresh:schedule,backOnEscape:event=>{
    if(!detail.classList.contains('show')||!history.length||pending)return false;
    event.preventDefault();event.stopPropagation();goBack();return true;
  },state:()=>({category:category(active||snapshot()),historyLength:history.length,pending:!!pending})};
  update();
})();

/* ═══════════════════════════════════════════════════════════════
   工具工作面接线（2026-09-28）

   用户定案：点「工具与功能」里的一项 → 原地展开成横条，
   横向占满【一级卡+二级卡+三级卡】的总宽，操作位置不动。

   几何（anchor 坐标系，见 ui.html 里 .block-card left:0 / #zones left:340 /
   .detail-card left:580 三处定义）：
     主卡 0~300 · 二级 340~540 · 三级 580~880
     → left 0, width 880, height 400 = 用户要的 880×400

   ⚠ 复用现成的 .workspace-host + --workspace-* 机制 ——
     那条路本来就会把三级卡撑开，我只改"撑多大"和"撑完画什么"。
   ⚠ 展开期间把一级卡和二级卡藏起来：它们被完全盖住了，留着只会
     在动画途中从边缘透出来。
   ═══════════════════════════════════════════════════════════════ */
(function(){
  if(!window.V7ToolWorkbench) return;
  const anchorEl2=document.querySelector('.anchor');
  const SPAN_LEFT=0, SPAN_TOP=0, SPAN_W=880, SPAN_H=400;

  // 自由模式的工作区（窗口坐标）。
  // ⚠ V7FloatingBars.workArea() 只给上下边界（它管的是导航/ Dock 让位），
  //   左右得自己取。别写 area.left —— 那是 undefined，会算出 NaN 宽度。
  function freeArea(){
    const bar=window.V7FloatingBars?.workArea?.();
    return {left:8,right:innerWidth-8,top:bar?bar.top:60,bottom:bar?bar.bottom:innerHeight-16};
  }
  // 把「窗口坐标下想放的位置」夹回工作区，换算成 anchor 坐标（--workspace-* 用的是 anchor 坐标系）
  function clampFreeToAnchor(wantLeft,wantTop,w,h){
    const a=freeArea(),rect=anchorEl2?anchorEl2.getBoundingClientRect():{left:0,top:0};
    const left=Math.max(a.left,Math.min(wantLeft,a.right-w));
    const top=Math.max(a.top,Math.min(wantTop,a.bottom-h));
    return {left:left-rect.left,top:top-rect.top};
  }
  function applyToolGeometry(){
    const freeMode=window.V7FreeMode?.isActive?.();
    // 自由模式没有"三张卡排一行"这个前提，横跨三段没有意义。
    // 改成：在当前卡原位展开（用户拖过就用拖到的位置），尺寸取 880×400 与工作区的较小值，再夹回工作区。
    if(freeMode){
      const a=freeArea();
      const cardRect=cards[cur]?.getBoundingClientRect?.();
      const w=Math.min(SPAN_W,Math.max(320,a.right-a.left)), h=Math.min(SPAN_H,Math.max(220,a.bottom-a.top));
      const saved=settingsRuntime.toolCardFreePos;
      const wantLeft=saved&&Number.isFinite(saved.left)?saved.left:(cardRect?cardRect.left:a.left);
      const wantTop=saved&&Number.isFinite(saved.top)?saved.top:(cardRect?cardRect.top:a.top);
      return {...clampFreeToAnchor(wantLeft,wantTop,w,h),width:w,height:h};
    }
    // 聚合模式：大卡永远从主卡左缘铺到三级卡右缘（贴着一级卡左上角）。
    // 想换位置就拖顶栏 —— 拖的是整个窗口，一二三级卡、任务栏、报错栏一起走（见下面 setupToolCardDrag）。
    return {left:SPAN_LEFT,top:SPAN_TOP,width:SPAN_W,height:SPAN_H};
  }

  function setToolGeometry(){
    if(!detail?.classList.contains('v7tw-host'))return;
    const spec=applyToolGeometry();
    for(const [key,value]of Object.entries(spec)){
      const next=Math.round(value)+'px';
      if(detail.style.getPropertyValue('--workspace-'+key)!==next)detail.style.setProperty('--workspace-'+key,next);
    }
    // 拉幕式展开：内容按【最终宽度】排好，卡片变宽只是把它逐渐露出来 ——
    //   否则展开途中内容会先被挤在 300 宽里、顶栏文字被截断，再被撑开（2026-09-28 截图抓到）
    detail.style.setProperty('--v7tw-final-w',Math.round(spec.width)+'px');
  }

  let toolHandle=null, motionToken=0;
  // 当前卡在 anchor 坐标系里的位置 —— 大卡从这里"长"出来，收起时也缩回这里
  function rectInAnchor(el){
    if(!el||!anchorEl2)return null;
    const a=anchorEl2.getBoundingClientRect(),r=el.getBoundingClientRect();
    if(!(r.width>0&&r.height>0))return null;
    return {left:r.left-a.left,top:r.top-a.top,width:r.width,height:r.height};
  }
  function setGeometry(rect){
    for(const [key,value]of Object.entries(rect))detail.style.setProperty('--workspace-'+key,Math.round(value)+'px');
  }
  const FALLBACK_START={left:580,top:0,width:300,height:400};   // 找不到当前卡时从三级卡原位长出来

  window.V7ToolWorkbench.configure({
    open(spec){
      const body=document.getElementById('dcBody');
      if(!body||typeof spec.mount!=='function')return null;
      const token=++motionToken;
      const TW=window.V7ToolWorkbench;
      const card=cards[cur];
      const start=rectInAnchor(card)||FALLBACK_START;

      /* ═══ 编排 v3：【先收拢，再变身】═══════════════════════════
         ①   0ms  大卡【无动画】落在当前卡原位、完全透明；其它元素开始朝当前卡收拢
         ② 240ms  大卡在当前卡原位淡入，当前卡同时淡出（原地交接）
         ③ 350ms  大卡从当前卡大小展开到目标尺寸（CSS 过渡 340ms），挂上内容
         ⚠ v2 用户看不到任何动画：收拢和展开同时起，面板 z50 盖在上面，
           卡片在它背后淡 —— 所以必须分拍，收拢这一拍要让人看完。 */
      // .show 必须加：.detail-card 默认 opacity:0 / pointer-events:none（上一轮"打开不显示"就是漏了它）
      detail.classList.remove('closing');
      detail.style.transition='none';                // 先无动画地落到当前卡原位
      detail.style.opacity='0';
      detail.classList.add('show','workspace-host','v7tw-host');
      setGeometry(start);
      void detail.offsetWidth;                       // ⚠ 强制一次布局再恢复过渡 —— 同帧设置不会按预期触发过渡
      detail.style.transition='';
      const expand=document.querySelector('[data-v7-nav-expand]');
      if(expand)expand.hidden=true;                  // 工具本来就满宽，不需要"扩大"按钮
      const crumb=detail.querySelector('[data-v7-nav-crumb]');
      if(crumb)crumb.textContent=spec.title||'工具';
      body.dataset.toolWorkbench=spec.id||'';
      body.innerHTML='';
      document.body.classList.add('v7tw-covering');
      document.body.dataset.v7twPhase='gathering';
      detailUsed=true;
      toolHandle={id:spec.id,dispose:null};          // 先占位：动画途中点关闭也能正常收起

      let gathered=0;
      try{ gathered=TW.yieldOut?TW.yieldOut(card):0; }
      catch(error){ window.ERR?.report('TOOL_OPEN_FAILED',{message:String(error&&error.message||error)}); }

      const grow=()=>{
        if(token!==motionToken)return;
        document.body.dataset.v7twPhase='expanding';
        setToolGeometry();                           // ⭐ 从当前卡大小展开到目标尺寸
        let dispose=null;
        try{ const r=spec.mount(body); if(typeof r==='function')dispose=r; }
        catch(error){ window.ERR?.report('TOOL_OPEN_FAILED',{message:String(error&&error.message||error)}); }
        toolHandle={id:spec.id,dispose};
        setTimeout(()=>{ if(token===motionToken)document.body.dataset.v7twPhase='open'; },360);
      };
      const morph=()=>{
        if(token!==motionToken)return;
        document.body.dataset.v7twPhase='morphing';
        detail.style.opacity='';                     // 交还 .show：大卡在当前卡原位淡入
        try{ TW.morphCurrentOut?.(card); }catch(_){}
        setTimeout(grow,90);
      };
      // 有东西可收：等收拢这一拍（200ms）播完再交接；什么都没有就直接交接
      setTimeout(morph,gathered?200:0);
      return {close(){window.V7ToolWorkbench.close();}};
    },
    close(){
      if(!detail.classList.contains('v7tw-host'))return;
      const token=++motionToken;                     // 作废还没跑完的展开步骤（快速开关）
      const TW=window.V7ToolWorkbench;
      try{ toolHandle?.dispose?.(); }catch(_){}
      toolHandle=null;
      const body=document.getElementById('dcBody');
      if(body){body.removeAttribute('data-tool-workbench');body.innerHTML='';}
      document.body.dataset.v7twPhase='closing';
      /* ═══ 收起：展开的镜像 ═══════════════════════════════════
         ①   0ms  大卡缩回当前卡原位（CSS 过渡 340ms）
         ② 160ms  当前卡在原位淡回，大卡同时淡出（原地交接）
         ③ 280ms  其它元素从当前卡"放出来"，回到各自位置
         ④ 结束   摘掉工作面的类、清内联值
         ⚠ v2 这里只摘类、从没调 restoreYield —— 所以收起时什么都不回来。 */
      const card=cards[cur];
      setGeometry(rectInAnchor(card)||FALLBACK_START);
      setTimeout(()=>{ if(token===motionToken)detail.style.opacity='0'; },160);
      let total=0;
      try{ total=TW.restoreYield?TW.restoreYield({currentDelay:160,othersDelay:280}):0; }catch(_){}
      const finish=()=>{
        if(token!==motionToken)return;
        // ⚠ 先摘 covering 再摘 .show —— 反过来的话观察者会把这次收尾当成"× 被点了"再跑一遍
        document.body.classList.remove('v7tw-covering');
        detail.style.transition='none';              // 几何回到三级卡默认位时别再播一段
        detail.classList.remove('show','workspace-host','v7tw-host');
        for(const key of ['left','top','width','height'])detail.style.removeProperty('--workspace-'+key);
        detail.style.removeProperty('--v7tw-final-w');
        void detail.offsetWidth;
        detail.style.transition='';
        detail.style.opacity='';
        delete document.body.dataset.v7twPhase;
        try{ if(window.PRESETUI?.state?.().toolGroupOpen)window.PRESETUI.fillZone(); }catch(_){}
      };
      setTimeout(finish,Math.max(380,total+20));
    },
    // 工具顶栏的 × —— 复用三级卡导航条上那个 × 的现成逻辑（closeAll），不另写一套。
    // 导航条在工具模式下是藏着的，但隐藏按钮的 click() 照样会触发它自己的处理函数。
    closeAll(){ document.querySelector('[data-v7-nav-close]')?.click(); },
    isOpen:()=>!!toolHandle,
    ownsGeometry:true,
  });

  // 窗口尺寸变了 / 进出自由模式，重新算几何
  window.addEventListener('resize',setToolGeometry);
  window.addEventListener('wheelchair:free-mode-changed',setToolGeometry);

  /* ⭐ 工具大卡拖动（2026-09-29 用户定案）
     按住大卡顶栏（.v7tw-top，按钮/输入框除外）拖：
     · 聚合模式：拖的是【整个程序窗口】—— 和拖主卡顶栏同一套 uiwin.dragStart/dragEnd（主进程高频跟随）。
       大卡打开时收拢进来的一二三级卡、任务栏、报错栏都在这个窗口里，所以整组一起走；关掉大卡后它们在新位置展开。
     · 自由模式：窗口铺满屏幕，只挪大卡自己；其它卡片的摆放一概不动（打开时它们只是暂时收拢淡出，关闭后回各自原位）。
       松手夹回工作区并记住（settingsRuntime.toolCardFreePos，窗口坐标），下次打开就在那儿；双击顶栏回到「当前卡原位展开」。
     ⚠ 取代 09-28 那版：那版挂在三级卡导航条上，而工具模式下导航条是藏着的 → 根本拖不了；
       聚合模式下只挪大卡、整组不跟；松手还调了一个不存在的 saveSettings() → 真拖过一次就报错。 */
  (function setupToolCardDrag(){
    let mode=null, moved=false, startX=0, startY=0, startLeft=0, startTop=0;
    const handleOf=target=>{
      if(!detail.classList.contains('v7tw-host'))return null;
      const bar=target&&target.closest?target.closest('.v7tw-top'):null;
      if(!bar||!detail.contains(bar))return null;
      if(target.closest('button,input,select,textarea,a,[role="button"],[contenteditable="true"]'))return null;
      return bar;
    };
    detail.addEventListener('mousedown',event=>{
      if(event.button!==0||mode||!handleOf(event.target))return;
      if(document.body.dataset.v7twPhase!=='open')return;          // 展开/收起动画途中不接，免得和几何过渡打架
      event.preventDefault();event.stopPropagation();
      moved=false;
      if(window.V7FreeMode?.isActive?.()){
        mode='free';startX=event.clientX;startY=event.clientY;
        startLeft=parseFloat(detail.style.getPropertyValue('--workspace-left'))||0;
        startTop=parseFloat(detail.style.getPropertyValue('--workspace-top'))||0;
        detail.style.transition='none';                            // 否则 340ms 的几何过渡会让卡片拖着拖着"追"鼠标
      }else{
        if(!window.uiwin||typeof window.uiwin.dragStart!=='function')return;
        mode='window';
        window.uiwin.dragStart();
      }
      document.body.classList.add('v7tw-dragging');
    },true);
    window.addEventListener('mousemove',event=>{
      if(mode!=='free')return;
      const dx=event.clientX-startX, dy=event.clientY-startY;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;              // 只是点一下标题，不算拖（不乱记位置）
      moved=true;
      const w=parseFloat(detail.style.getPropertyValue('--workspace-width'))||SPAN_W;
      const h=parseFloat(detail.style.getPropertyValue('--workspace-height'))||SPAN_H;
      const rect=anchorEl2?anchorEl2.getBoundingClientRect():{left:0,top:0};
      const pos=clampFreeToAnchor(rect.left+startLeft+dx,rect.top+startTop+dy,w,h);
      detail.style.setProperty('--workspace-left',Math.round(pos.left)+'px');
      detail.style.setProperty('--workspace-top',Math.round(pos.top)+'px');
    });
    const finish=()=>{
      if(!mode)return;
      const was=mode;mode=null;
      document.body.classList.remove('v7tw-dragging');
      if(was==='window'){
        try{window.uiwin.dragEnd();}catch(_){}
        updateStackPositions();                                      // 窗口挪了，任务堆/报错堆重新算（同拖主卡）
        return;
      }
      detail.style.transition='';
      if(!moved)return;
      const rect=anchorEl2?anchorEl2.getBoundingClientRect():{left:0,top:0};
      settingsRuntime.toolCardFreePos={
        left:Math.round((parseFloat(detail.style.getPropertyValue('--workspace-left'))||0)+rect.left),
        top:Math.round((parseFloat(detail.style.getPropertyValue('--workspace-top'))||0)+rect.top)};
      settingsSave();
    };
    window.addEventListener('mouseup',finish);
    window.addEventListener('blur',finish);
    // 双击顶栏：自由模式回到「当前卡原位展开」（拖丢了也能找回来）
    detail.addEventListener('dblclick',event=>{
      if(!handleOf(event.target)||!window.V7FreeMode?.isActive?.())return;
      event.preventDefault();event.stopPropagation();
      settingsRuntime.toolCardFreePos=null;settingsSave();setToolGeometry();
    },true);
  })();

  // ⚠ 关闭按钮（三级卡右上角那个 ×）走的是 main IIFE 里的 closeAll()，
  //   它只做 detail.classList.remove('show','closing') —— 【不会调我的 close()】。
  //   不管的话：点 × 之后卡是收了，但我加的 v7tw-covering 还挂在 body 上，
  //   一级卡和二级卡【一直藏着不回来】。用户看到的就是"关掉之后主卡没了"。
  //   closeAll 在另一个 IIFE 里改不到，所以用观察者兜住：只要 .show 被摘掉，
  //   就补一次清理。幂等 —— 重复调用无副作用。
  const detailObserver=new MutationObserver(()=>{
    if(!detail.classList.contains('show')&&document.body.classList.contains('v7tw-covering')){
      window.V7ToolWorkbench.close();
    }
  });
  detailObserver.observe(detail,{attributes:true,attributeFilter:['class']});
})();
</script>
<script src="floating-bars.js"></script>
