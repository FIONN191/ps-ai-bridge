<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<title>大图查看</title>
<!--
  大图查看：显示器级独立冻结窗口。

  为什么必须独立开窗，不能留在主窗口里：
  主窗口是死的 1020×1100，`position:fixed; inset:0` 只能铺满这个小框，
  出不了窗口边界，所以永远做不到"全屏冻结"。L4 是另开一个铺满显示器的
  窗口才做到的，大图照抄这个做法。

  ⚠ 刻意不和 L4 共用一份 HTML/接口：
  L4 传的是标题/正文/按钮，大图传的是图片/张数，塞进同一个 payload 会变成
  谁都不敢改的联合体。两边共用的只是"开一个铺满显示器的透明窗口"这个手法，
  数据接口各走各的。

  交互全套照搬原来主窗口里的大图层，一个不少：
  滚轮切上下张 / Ctrl+滚轮缩放 / 拖拽移动 / 双击复位 / Esc 退出 / 点空白关闭。
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="icons.css">
<style nonce="__TAURI_STYLE_NONCE__">
  /* ⚠ 代币来自 tokens.css（head 里先引入）。这里只覆盖一个：
     --line 比全局的 .09 亮不少(.16) —— 这个窗口是【铺满显示器的近黑遮罩】，
     .09 的描边在上面几乎看不见。这是有理由的覆盖，不是抄漏了。 */
  :root{
    --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;}
  body{
    background:transparent;
    font-family:'OPPO Sans',-apple-system,"SF Pro","Segoe UI","Microsoft YaHei",sans-serif;
    user-select:none;
  }
  /* 冻结层：铺满整个显示器。窗口本身就是这么大，所以这里的"全屏"是真全屏。 */
  .freeze-layer{
    position:absolute; left:0; top:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,10,14,.88);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    overflow:hidden;
    opacity:0;
    transition:opacity .2s var(--ease-soft);
  }
  .freeze-layer.ready{opacity:1;}
  /* ⚠ 图片：适配当前屏幕并给底部胶囊留安全区，尽可能完整显示原图。
     transform 由 JS 控制(scale/translate)；cursor 随拖拽状态变。 */
  #pvimg{
    position:absolute; left:50%; top:50%;
    max-width:calc(100vw - 40px); max-height:calc(100vh - 104px);
    width:auto; height:auto; object-fit:contain;
    cursor:grab; user-select:none; -webkit-user-drag:none;
    transform-origin:center center;
    will-change:transform;
  }
  #pvimg.dragging{cursor:grabbing;}
  #pvimg.empty{opacity:0;}
  /* 底部信息条：第几张 + 操作提示 */
  .pv-info{
    position:absolute; left:50%; bottom:18px;
    transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center; gap:8px;
    max-width:calc(100vw - 32px); padding:8px 14px;
    border:1px solid var(--line); border-radius:999px;
    background:hsl(var(--card-h, 220 28%) 9% / .82);
    backdrop-filter:blur(14px) saturate(1.15); -webkit-backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:0 8px 26px rgba(0,0,0,.36);
    text-align:center; font-size:12px; line-height:1.3; color:var(--tx2);
    pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,.8);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pv-info .pv-num{flex:0 0 auto; font-weight:600; color:#fff; margin-right:2px;}
  .pv-info > span:last-child{overflow:hidden; text-overflow:ellipsis;}
  .close{
    position:absolute; top:24px; right:30px;
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--line); background:rgba(255,255,255,.12);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    transition:background .15s var(--ease-out); z-index:2;
  }
  .close:hover{background:rgba(255,255,255,.24);}
</style>
</head>
<body>
  <main class="freeze-layer" id="freezeLayer" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="close" id="pvclose" type="button" aria-label="关闭图片预览" title="关闭（Esc）" data-icon-static="close" data-icon-size="20">✕</button>
    <img id="pvimg" class="empty" alt="">
    <div class="pv-info"><span class="pv-num" id="pvNum"></span><span>滚轮 切换上下张 · Ctrl+滚轮 缩放 · 拖拽 移动 · 双击 复位</span></div>
  </main>
<!-- Tauri 下补出 window.viewerwin（Electron 由 viewer-preload.js 提供，此文件自动空转） -->
<script src="reload-guard.js"></script>
<script src="icons.js"></script>
<script src="tauri-child-adapter.js"></script>
<script>
// 图标：把 HTML 里 [data-icon-static] 的位置渲染成 SVG（2026-09-14）
try{ if(window.ICON) ICON.mountStatic(); }catch(_){ }

  const layer=document.getElementById('freezeLayer');
  const img=document.getElementById('pvimg');
  const num=document.getElementById('pvNum');
  const closeBtn=document.getElementById('pvclose');

  // ⚠⚠ 遮罩必须【立刻】可见，绝不能等数据到了才显形。
  //   这个窗口是全屏置顶且吃掉所有鼠标事件的。以前 .ready 只在 applyData 里加，
  //   数据一旦没送达就变成"看不见但锁死整个屏幕"的窗口 —— 最糟的失败模式。
  //   现在: 先亮起来, 内容后填。哪怕数据永远不来, 用户也能看见并关掉它。
  layer.classList.add('ready');

  // 数据迟迟不来就把原因显示在屏幕上。没有这个就只能靠猜。
  let gotData=false;
  setTimeout(function(){
    if(gotData) return;
    num.textContent='图片没送达';
    const why=!window.viewerwin ? '桥接层未加载(viewerwin 不存在)'
            : (window.viewerwin.lastError || '主窗口没有发送数据');
    const tip=document.createElement('div');
    tip.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:70vw;padding:16px 20px;border-radius:14px;background:rgba(30,18,22,.94);border:1px solid rgba(255,120,120,.4);color:#ffd5d5;font-size:13px;line-height:1.6;text-align:center;';
    tip.textContent='大图数据没送达：'+why+'　（按 Esc 或点空白处关闭）';
    layer.appendChild(tip);
  },1500);

  // 缩放和位移。⚠ 切上下张【保留】当前倍数和位移（用户明确要求），
  //   所以这三个值只在双击复位时才清零，换图时不动。
  let scale=1, offX=0, offY=0, drag=null;

  function applyTransform(){
    // 先以图片自身中心对齐视口，再叠加用户拖拽位移和缩放，避免大图按左上角定位。
    img.style.transform='translate(calc(-50% + '+offX+'px),calc(-50% + '+offY+'px)) scale('+scale+')';
  }
  function resetView(){ scale=1; offX=0; offY=0; applyTransform(); }

  // 收到的是原图【二进制】，不是 base64。
  // ⚠ 传 base64 会在这个进程里再复制一份 21MB 字符串、再解一次码，
  //   这是以前"点开大图有滞后"的主要来源。二进制直接包成 Blob 用，快得多。
  let curUrl=null;
  let renderedSeq=null;
  function setImageBytes(bytes, mime){
    const blob=new Blob([bytes], {type: mime||'image/png'});
    const next=URL.createObjectURL(blob);
    const prev=curUrl;
    curUrl=next;
    img.src=next;
    img.classList.remove('empty');
    // ⚠ 旧地址等新图真正上屏了再放：立刻 revoke 会让画面闪一下白。
    if(prev) img.addEventListener('load',()=>URL.revokeObjectURL(prev),{once:true});
  }

  // 换图只改图和张数；主窗口那头已经算好了"下一张是哪张"，这里不做业务判断。
  function applyData(data){
    data=data||{};
    // Keep a final renderer-side guard.  The adapter filters late Tauri
    // completions, but this page can also receive data from Electron or a
    // test/host bridge that does not implement that filter.
    const seq=data.seq == null ? null : Number(data.seq);
    if(seq != null && Number.isFinite(seq) && renderedSeq != null && seq < renderedSeq) return;
    if(seq != null && Number.isFinite(seq)) renderedSeq=seq;
    gotData=true;
    if(data.bytes) setImageBytes(data.bytes, data.mime);
    else if(typeof data.src==='string' && data.src){ img.src=data.src; img.classList.remove('empty'); }
    num.textContent=(data.total>0 && data.num>0) ? (data.num+' / '+data.total) : '';
    // 首次拿到数据才复位：后续换图沿用当前缩放/位移。
    if(data.reset) resetView(); else applyTransform();
    requestAnimationFrame(()=>layer.classList.add('ready'));
  }

  function requestClose(){ if(window.viewerwin) window.viewerwin.close(); }

  if(window.viewerwin) window.viewerwin.onData(applyData);

  closeBtn.addEventListener('click',e=>{ e.stopPropagation(); requestClose(); });
  // 点遮罩空白处关闭；点在图片上不关（要留给拖拽）。
  layer.addEventListener('click',e=>{ if(e.target===layer) requestClose(); });

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ e.preventDefault(); requestClose(); }
  });

  // 滚轮：默认切上下张；Ctrl+滚轮 = 缩放(以图片中心)
  layer.addEventListener('wheel',e=>{
    e.preventDefault(); e.stopPropagation();
    if(e.ctrlKey){
      const k = e.deltaY>0 ? 0.9 : 1.1;
      scale = Math.max(0.5, Math.min(6, scale*k));   // 缩放范围 0.5x ~ 6x
      applyTransform();
    }else{
      // 只报"往上一张还是下一张"，跳过未完成/失败图的判断留在主窗口。
      if(window.viewerwin) window.viewerwin.nav(e.deltaY>0 ? 1 : -1);
    }
  },{passive:false});

  img.addEventListener('mousedown',e=>{
    e.preventDefault(); e.stopPropagation();
    drag={sx:e.clientX, sy:e.clientY, ox:offX, oy:offY};
    img.classList.add('dragging');
  });
  window.addEventListener('mousemove',e=>{
    if(!drag) return;
    offX = drag.ox + (e.clientX - drag.sx);
    offY = drag.oy + (e.clientY - drag.sy);
    applyTransform();
  });
  window.addEventListener('mouseup',()=>{
    if(drag){ drag=null; img.classList.remove('dragging'); }
  });
  img.addEventListener('dblclick',e=>{ e.stopPropagation(); resetView(); });

  // 窗口刚起来时焦点给关闭按钮，保证 Esc 立刻可用。
  requestAnimationFrame(()=>{ try{ closeBtn.focus({preventScroll:true}); }catch(_){ } });
</script>


</body></html>
